/**:
  ros__parameters:
    # Grid Map Settings for Threat Zone Scenario
    grid_map/resolution: 0.1
    grid_map/map_size_x: 100.0   # X: -10 ~ 70
    grid_map/map_size_y: 100.0   # Y: -30 ~ 30
    grid_map/map_size_z: 10.0    # Z: 0 ~ 30m (3D threat visualization)
    grid_map/frame_id: "world"

    grid_map/map_origin_x: 0.0
    grid_map/map_origin_y: 0.0

    # Obstacle and Collision Settings
    grid_map/obstacles_inflation: 0.8
    grid_map/local_bound_inflate: 15.0

    # Map Boundary Settings (2D)
    grid_map/virtual_ceil_height: -1.0
    grid_map/local_map_margin: 10

    # ESDF Settings (2D slice)
    grid_map/esdf_slice_height: 0.0
    grid_map/show_esdf_time: false

    # Threat Zone Settings (ENABLED for this scenario)
    grid_map/use_threat_zones: true
    grid_map/threat_cost_weight: 1.0

    # Path visualization threat zone settings
    enable_threat_zones: true
    threat_visualization_resolution: 1.0  # 3D visualization (larger = less cubes, better visibility)
