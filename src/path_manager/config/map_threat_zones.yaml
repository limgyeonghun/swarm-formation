/**:
  ros__parameters:
    # Grid Map Settings for Threat Zone Scenario
    grid_map/resolution: 0.5
    grid_map/map_size_x: 350.0   # X: -50 ~ +50 (centered at 0,0)
    grid_map/map_size_y: 350.0   # Y: -50 ~ +50 (centered at 0,0)
    grid_map/map_size_z: 100.0    # Z: ground_height ~ ground_height+10
    grid_map/frame_id: "world"

    grid_map/map_origin_x: 0.0   # 0.0 means auto-center at origin
    grid_map/map_origin_y: 0.0
    grid_map/ground_height: -0.01  # Ground level

    # Obstacle and Collision Settings
    grid_map/obstacles_inflation: 1.0
    grid_map/local_bound_inflate: 15.0
    grid_map/publish_global_esdf_viz: false

    # Map Boundary Settings (2D)
    grid_map/virtual_ceil_height: -1.0
    grid_map/local_map_margin: 10

    # ESDF Settings (2D slice)
    grid_map/esdf_slice_height: 0.0
    grid_map/show_esdf_time: false

    # Threat Zone Settings (ENABLED for this scenario)
    grid_map/use_threat_zones: true

    # Terrain Obstacle Settings (ENABLED for terrain-based path planning)
    grid_map/use_terrain_obstacles: true
    grid_map/terrain_obstacle_threshold: 1.0  # Elevation threshold in meters
    grid_map/terrain_target_cell_size: 100.0   # Match TARGET_CELL_SIZE_M in terrain_publisher.py

    # Path visualization threat zone settings
    enable_threat_zones: true
    threat_visualization_resolution: 1.0  # 3D visualization (larger = less cubes, better visibility)
