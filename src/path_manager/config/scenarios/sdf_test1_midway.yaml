/**:
  ros__parameters:
    # =============================================================
    # Scenario 1: Midway restricted zone gauntlet
    # Pairs with formation_manager/config/scenario_sdf_test1.yaml
    # start = (610.59, 108.07), goal = (155.60, 854.72)
    #
    # Four restricted zones placed on/beside the direct line so the drone has to
    # weave at the 25/50/75 % checkpoints. None of them are clustered
    # around the goal itself.
    # =============================================================

    obstacles: [0.0, -9999.0, 0.0]

    # [cx, cy, cz, sensing_range, max_risk_level]
    risk_zones: [
      # 25% checkpoint, slightly off the corridor → forces first dodge
      495.0, 295.0, 0.0, 120.0, 100.0,
      # 50% checkpoint, dead center on the corridor → main blocker
      383.0, 481.0, 0.0, 100.0, 100.0,
      # 50% checkpoint, opposite side → narrows the detour options
      410.0, 600.0, 0.0, 90.0, 100.0,
      # 75% checkpoint, slightly off the corridor → last dodge
      325.0, 706.0, 0.0, 110.0, 100.0
    ]
