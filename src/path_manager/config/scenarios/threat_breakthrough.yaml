/**:
  ros__parameters:
    # =============================================================
    # Threat Zone Breakthrough Scenario
    # Goal is surrounded by threats — mission forces penetration
    # through the weakest overlap.
    #
    # Layout (top view):
    #
    #                   SAM1 (50, 15)
    #                      ●
    #                      |
    #       SAM3 --------- G(50,0) --------- SAM4
    #       (35,0)                           (65,0)
    #                      |
    #                      ●
    #                   SAM2 (50, -15)
    #
    #   Start(0,0) ---> ... ---> Goal(50,0)
    #
    # All four threats' detection ranges overlap around the goal, so any
    # approach must cross a detection region. RRT* should pick the weakest
    # overlap (gap between two adjacent threats at the edges).
    # =============================================================

    # No physical obstacles — pure threat zone test
    obstacles: [0.0, -9999.0, 0.0]

    # [cx, cy, cz, detection_range, engagement_range, max_threat_level]
    # engagement_range kept for compatibility but threat model now uses
    # detection_range as the single Gaussian sigma support.
    threat_zones: [
       35.0,   0.0, 0.0, 15.0, 6.0, 100.0,
       65.0,   0.0, 0.0, 15.0, 6.0, 100.0,
       50.0,  15.0, 0.0, 18.0, 8.0, 120.0,
       50.0, -15.0, 0.0, 18.0, 8.0, 120.0
    ]
