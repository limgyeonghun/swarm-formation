/**:
  ros__parameters:
    # =============================================================
    # Threat Zone Test Scenario
    # Tests air defense (SAM) avoidance with cost-aware RRT*
    # =============================================================

    # Physical obstacles (hard constraints - walls)
    # No physical obstacles in this scenario — only threat zones
    obstacles: [0.0, -9999.0, 0.0]

    # Threat zones (soft constraints - high cost but penetrable)
    # Format: [cx, cy, cz, detection_range, engagement_range, max_threat_level]
    #
    #   detection_range: outer radius where UAV is detected (linear decay)
    #   engagement_range: inner radius where missiles can engage (Gaussian decay)
    #   max_threat_level: peak threat intensity at center
    #
    # Layout:
    #   Start(0,0) ----> SAM1(25,0) ----> SAM2(40,-5) ----> Goal(60,0)
    #                        |                |
    #                      AAA1(40,10)
    #
    # SAM1 blocks the direct path. The planner should:
    #   1. Route around SAM1 if possible
    #   2. If surrounded, penetrate through the weakest overlap
    threat_zones: [
      25.0, 0.0, 0.0,  15.0, 8.0, 100.0,
      40.0, -5.0, 0.0, 20.0, 10.0, 150.0,
      40.0, 10.0, 0.0, 10.0, 6.0, 80.0
    ]
