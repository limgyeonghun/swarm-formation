/**:
  ros__parameters:
    # Physical obstacles (hard constraints - walls)
    # 7-field format: [cx, cy, cz, shape, p1, p2, height]
    #   shape=0 (circle):    p1=radius, p2=0
    #   shape=1 (rectangle): p1=width,  p2=length
    #   height=0 → infinite column
    obstacles: [125.0, 0.5, -2.0, 0.0, 2.5, 0.0, 4.0]


    # Risk zones (soft constraints - high cost but penetrable)
    # Format: [cx, cy, cz, detection_range, max_risk_level]
    #   detection_range:   Gaussian support radius (sigma = range/3)
    #   max_risk_level:  peak risk intensity at center
    risk_zones: [
      25.0, 0.0, 0.0,  4.5, 100.0,
      # 40.0, -5.0, 0.0, 0.1, 100.0,
      40.0, 10.0, 0.0, 3.0, 100.0
    ]
