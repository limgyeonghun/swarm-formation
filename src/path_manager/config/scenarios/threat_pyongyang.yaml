/**:
  ros__parameters:
    # =============================================================
    # Pyongyang-style Threat Scenario — Full Area Coverage
    # The entire mission area is blanketed by overlapping SAM sites.
    # No pure-safe detour exists. RRT* must route through the least
    # dense region of overlap.
    #
    # Layout (top view, approximate real-world scale 1 unit = 1 m):
    #
    #       (10,20)  (30,20)  (50,20)  (70,20)
    #          ●        ●        ●        ●
    #                                          ← upper SAM belt
    #       (0,0)                           (80,0)
    #        S                               G
    #                                          ← lower SAM belt
    #          ●        ●        ●        ●
    #       (10,-20) (30,-20) (50,-20) (70,-20)
    #
    # Plus a central "urban" cluster at (40, 0) region (city defense).
    # Every point between start and goal is within some detection range.
    # =============================================================

    obstacles: [0.0, -9999.0, 0.0]

    # [cx, cy, cz, detection_range, engagement_range, max_threat_level]
    threat_zones: [
       # Upper belt
       10.0,  20.0, 0.0, 18.0, 8.0, 100.0,
       30.0,  20.0, 0.0, 18.0, 8.0, 120.0,
       50.0,  20.0, 0.0, 18.0, 8.0, 120.0,
       70.0,  20.0, 0.0, 18.0, 8.0, 100.0,
       # Lower belt
       10.0, -20.0, 0.0, 18.0, 8.0, 100.0,
       30.0, -20.0, 0.0, 18.0, 8.0, 120.0,
       50.0, -20.0, 0.0, 18.0, 8.0, 120.0,
       70.0, -20.0, 0.0, 18.0, 8.0, 100.0,
       # Central urban cluster (heaviest)
       40.0,   0.0, 0.0, 20.0, 10.0, 150.0,
       25.0,   5.0, 0.0, 12.0, 6.0,  80.0,
       55.0,  -5.0, 0.0, 12.0, 6.0,  80.0
    ]
