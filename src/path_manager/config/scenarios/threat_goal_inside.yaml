/**:
  ros__parameters:
    # =============================================================
    # Goal Inside Threat Scenario
    # Target is located at the dead center of a large SAM site
    # (e.g. high-value target defended by its own close-in SAM).
    # Surrounding SAMs block the easy approaches, forcing the missile
    # to enter through the thinnest overlap and reach the target.
    #
    # Layout:
    #                SAM_N (40, 15)
    #                    ●
    #    SAM_W ─────── G (40,0) ─────── SAM_E
    #    (25,0)    ↑ main SAM ↑         (55,0)
    #             target SAM
    #             (40,0)
    #                    ●
    #                SAM_S (40,-15)
    #
    # The target SAM's detection covers the goal itself. The missile
    # must choose the weakest approach (likely between two neighbors
    # where their detection rings only faintly overlap).
    # =============================================================

    obstacles: [0.0, -9999.0, 0.0]

    # [cx, cy, cz, detection_range, engagement_range, max_threat_level]
    threat_zones: [
       # Main SAM protecting the goal itself (goal is inside!)
       40.0,   0.0, 0.0, 12.0, 6.0, 150.0,
       # Outer ring — 4 SAMs blocking approach corridors
       25.0,   0.0, 0.0, 10.0, 5.0,  90.0,
       55.0,   0.0, 0.0, 10.0, 5.0,  90.0,
       40.0,  15.0, 0.0, 12.0, 6.0, 100.0,
       40.0, -15.0, 0.0, 12.0, 6.0, 100.0
    ]
