/**:
  ros__parameters:
    # Optimization Algorithm Parameters
    optimization/constrain_points_perPiece: 3

    # Obstacle Avoidance Control
    enable_obstacles: false

    # Debug Logging Control
    enable_debug_logs: true
    enable_lbfgs_detail_logs: true

    # Cost Function Weights
    optimization/weight_obstacle: 50000.0
    optimization/weight_swarm: 50000.0
    optimization/weight_feasibility: 10000.0
    optimization/weight_sqrvariance: 10000.0
    optimization/weight_time: 10.0
    optimization/weight_formation: 15000.0
    optimization/weight_nonholonomic: 800.0

    # Safety Distance Settings
    optimization/obstacle_clearance: 0.8
    optimization/swarm_clearance: 0.5

    # Formation and Dynamics Constraints
    optimization/formation_type: 2
    optimization/max_vel: 1.5
    optimization/max_acc: 2.0

    # Nonholonomic Constraints
    optimization/min_forward_vel: 0.2
    optimization/max_brake_decel: 1.5
    optimization/max_curvature: 0.4
    optimization/max_lateral_accel: 1.2

    # Path Manager Parameters
    manager/max_vel: 1.5
    manager/max_acc: 2.0
    manager/polyTraj_piece_length: 2.0
    manager/planning_horizon: 6.0
    manager/intermediate_waypoint_ratio: 0.3

    # FSM Parameters
    fsm/thresh_replan_time: 0.25
    fsm/thresh_no_replan_meter: 1.0
    fsm/replan_trajectory_time: 0.05
    fsm/hungarian_distance_weight: 1.0
    fsm/hungarian_crossing_penalty: 0.0

    # ===== ABLATION STUDY: Full System (제안) =====
    ablation/assignment_method: "hungarian"
    ablation/enable_bspline: true
    ablation/enable_alignment: true
    ablation/enable_crossing_detection: true
    ablation/enable_metrics_logging: true
