/**:
  ros__parameters:
    # Optimization Algorithm Parameters
    optimization/constrain_points_perPiece: 3
    
    # Obstacle Avoidance Control
    enable_obstacles: true
    
    # Debug Logging Control
    enable_debug_logs: true  # Set to true to enable detailed timing logs
    enable_lbfgs_detail_logs: true  # Set to true to enable detailed L-BFGS cost debugging

    # Cost Function Weights (Traxxas-optimized)
    optimization/weight_obstacle: 50000.0
    optimization/weight_swarm: 50000.0
    optimization/weight_feasibility: 10000.0
    optimization/weight_sqrvariance: 10000.0
    optimization/weight_time: 40.0               # Reduced to allow more time for smooth paths
    optimization/weight_formation: 30000.0
    optimization/weight_nonholonomic: 10000.0    # CRITICAL: Must be much higher than formation to prevent spinning!

    # Safety Distance Settings
    optimization/obstacle_clearance: 0.8  # Further increased safety distance from obstacles
    optimization/swarm_clearance: 0.5  # Reduced to prevent A* failure when formation spacing is tight (0.67m spacing > 0.6m clearance)

    # Formation and Dynamics Constraints
    optimization/formation_type: 2
    optimization/max_vel: 1.6
    optimization/max_acc: 2.0               # Reduced from 3.0 to match your rover's capability

    # Nonholonomic Constraints (NO REVERSE TORQUE - coasting deceleration only)
    optimization/min_forward_vel: 0.2      # Increased to prevent near-zero velocity crazy spins
    optimization/max_brake_decel: 1.5       # Slightly increased for smoother stops
    optimization/max_curvature: 0.55         # TIGHTER: Prevent spinning (min turn radius = 2.5m)
    optimization/max_lateral_accel: 1.2     # TIGHTER: Reduce centripetal force for stability

    # Path Manager Parameters (Traxxas-optimized)
    manager/max_vel: 1.6                    # Keep your safety limit
    manager/max_acc: 2.0                    # Match optimization constraint
    manager/polyTraj_piece_length: 2.0
    manager/planning_horizon: 5.5
    
    # FSM Parameters
    fsm/thresh_replan_time: 0.25
    fsm/thresh_no_replan_meter: 1.0
    fsm/replan_trajectory_time: 0.05
    fsm/n_seconds_ahead: 0.5      # Lookahead distance on trajectory for direction (prevents corner cutting)
    fsm/rampup_duration: 1.5      # Duration over which to ramp up to full speed after trajectory update
    fsm/initial_lookahead_offset: 0.3  # Initial offset added to lookahead point on trajectory after update

    # Hungarian Assignment Parameters
    fsm/hungarian_distance_weight: 1.0     # Weight for distance cost (default: 1.0)
    fsm/hungarian_crossing_penalty: 5.0   # Penalty for path crossings in formation assignment (higher = stronger avoidance)
