/**:
  ros__parameters:
    # ============================================================
    # SDF-based Trajectory Optimization Parameters
    # Pipeline: RRT* (threat-aware) -> SDF path shortening -> MINCO
    #          -> L-BFGS with SDF gradient penalty
    # ============================================================

    optimization/constrain_points_perPiece: 50

    enable_obstacles: true
    enable_debug_logs: true
    enable_lbfgs_detail_logs: false

    # Cost function weights (scale matched to proven main-branch values).
    optimization/weight_obstacle: 50000.0     # SDF violation penalty
    optimization/weight_swarm: 0.0            # Swarm collision avoidance
    optimization/weight_feasibility: 10000.0   # Vel/acc feasibility
    optimization/weight_sqrvariance: 10000.0  # Distance variance (smoothness)
    optimization/weight_time: 20.0            # Time optimality
    optimization/weight_formation: 0.0        # Formation keeping
    optimization/weight_threat: 0.3           # Threat zone avoidance

    # Threat weighting in RRT* edge cost (cost = dist * (1 + alpha * threat))
    manager/threat_weight: 10.0

    optimization/swarm_clearance: 0.5

    optimization/formation_type: 2

    # Smoothing factor for smoothedL1 penalty
    optimization/smoothing_eps: 0.01

    # Dynamic limits
    optimization/max_vel: 3.0
    optimization/max_acc: 5.0

    manager/max_vel: 3.0
    manager/max_acc: 5.0

    # MINCO piece granularity (m per piece).
    # Smaller -> more pieces -> more inner points -> higher optimization DoF.
    manager/length_per_piece: 9999.0

    # Precomputed terrain ESDF (both optional). Flat binary format (.esdf).
    #   save_terrain_esdf: write .esdf after the first successful build.
    #   load_terrain_esdf: read .esdf instead of voxelizing (fast startup).
    # Usage: set save once, run, then switch to load for subsequent runs.
    manager/save_terrain_esdf: ""
    manager/load_terrain_esdf: "/home/ros/ws/dev/MMP/src/mmp_terrain/data/terrain.esdf"

    # Hungarian Assignment Parameters
    fsm/hungarian_distance_weight: 1.0
    fsm/hungarian_crossing_penalty: 0.0
