/**:
  ros__parameters:
    # Optimization Algorithm Parameters
    optimization/constrain_points_perPiece: 25
    
    # Obstacle Avoidance Control
    enable_obstacles: true
    
    # Debug Logging Control
    enable_debug_logs: true
    enable_lbfgs_detail_logs: false

    # Cost Function Weights (Traxxas-optimized)
    optimization/weight_obstacle: 50000.0
    optimization/weight_swarm: 0.0
    optimization/weight_feasibility: 5000.0
    optimization/weight_sqrvariance: 10000.0
    optimization/weight_time: 10.0
    optimization/weight_formation: 0.0
    optimization/weight_nonholonomic: 0.0
    optimization/weight_threat: 0.6

    # Safety Distance Settings
    optimization/obstacle_clearance: 0.8
    optimization/swarm_clearance: 0.5

    # Formation and Dynamics Constraints
    optimization/formation_type: 2
    optimization/max_vel: 3.0
    optimization/max_acc: 5.0

    # Nonholonomic Constraints
    optimization/min_forward_vel: 0.2
    optimization/max_brake_decel: 1.5
    optimization/max_curvature: 0.4
    optimization/max_lateral_accel: 1.2

    # Path Manager Parameters
    manager/max_vel: 3.0
    manager/max_acc: 5.0
    manager/polyTraj_piece_length: 8.0
    manager/planning_horizon: 30.0
    
    # FSM Parameters
    fsm/thresh_replan_time: 1.0
    fsm/thresh_no_replan_meter: 5.0
    fsm/replan_trajectory_time: 0.1

    # Hungarian Assignment Parameters
    fsm/hungarian_distance_weight: 1.0
    fsm/hungarian_crossing_penalty: 0.0

    # Global Path Intermediate Waypoint Parameters
    manager/intermediate_waypoint_ratio: -1.0
