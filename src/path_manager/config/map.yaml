/**:
  ros__parameters:
    # Grid Map Basic Settings (2D for Rover) - Optimized for all scenarios
    grid_map/resolution: 0.1
    grid_map/map_size_x: 150.0  # Covers X[-8.75 ~ 100.63] with margin
    grid_map/map_size_y: 200.0  # Covers Y[-138.94 ~ 40.0] with margin
    grid_map/map_size_z: 1.0    # Minimal height for 2D operation
    grid_map/frame_id: "world"

    # All scenarios coverage: X[-8.75 ~ 100.63], Y[-138.94 ~ 40.0]
    # With margins: X[-20 ~ 130], Y[-150 ~ 50]
    grid_map/map_origin_x: -20.0  # Covers X range with margin
    grid_map/map_origin_y: -150.0 # Covers Y range with margin

    # Obstacle and Collision Settings
    grid_map/obstacles_inflation: 0.8  # 1.6m x 1.6m x 1.6m cubic obstacle
    grid_map/local_bound_inflate: 15.0
    
    # Map Boundary Settings (2D)
    grid_map/virtual_ceil_height: -1.0  # Disabled (was 0.5 - causing all cells to be obstacles!)
    grid_map/local_map_margin: 10
    
    # ESDF Settings (2D slice)
    grid_map/esdf_slice_height: 0.0  # Ground level slice
    grid_map/show_esdf_time: false