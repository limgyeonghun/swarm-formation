/**:
  ros__parameters:
    # Grid Map Basic Settings
    grid_map/resolution: 0.1
    grid_map/map_size_x: 50.0
    grid_map/map_size_y: 50.0
    grid_map/map_size_z: 5.0
    grid_map/frame_id: "world"
    
    # Obstacle and Collision Settings
    grid_map/obstacles_inflation: 0.1
    grid_map/local_bound_inflate: 1.0
    
    # Map Boundary and Height Settings
    grid_map/virtual_ceil_height: -0.1
    grid_map/local_map_margin: 1
    
    # ESDF Settings
    grid_map/esdf_slice_height: -0.1
    grid_map/show_esdf_time: true
    
    # ESDF Update Optimization
    grid_map/esdf_update_skip: 2
    grid_map/esdf_update_threshold: 0.05
