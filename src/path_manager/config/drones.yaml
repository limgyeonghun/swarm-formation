/**:
  ros__parameters:
    # Number of Drones
    num_drones: 4
    
    # Initial formation settings (directly defined, not from formation_commander)
    use_initial_formation: true  # Enable direct initial formation definition
    formation_center_x: 0.5  # Road center line
    formation_center_y: 90.0  # Goal point along the road
    formation_center_z: 0.0
    
    # Formation type (square, triangle, line, circle, etc.)
    formation_type: "square"  # Line formation suitable for road following
    formation_scale: 1.0  # Formation size scaling factor (within 6m road width)
    
    drone_0:
      drone_id: 0
      start_point_x: 0.0  # Road left boundary (1.5 - 3/2 = -0.5)
      start_point_y: 0.0
      start_point_z: 0.0

    drone_1:
      drone_id: 1
      start_point_x: 0.0   # Road left-center (1.5 - 1/2 = 0.5)
      start_point_y: -2.0
      start_point_z: 0.0

    drone_2:
      drone_id: 2
      start_point_x: 2.0   # Road right-center (1.5 + 1/2 = 2.5)
      start_point_y: -2.0
      start_point_z: 0.0

    drone_3:
      drone_id: 3
      start_point_x: 2.0   # Road right boundary (1.5 + 3/2 = 3.5)
      start_point_y: 0.0
      start_point_z: 0.0
