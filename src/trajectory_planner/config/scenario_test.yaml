/**:
  ros__parameters:

    drone_0:
      start_point_x: 0.0
      start_point_y: 0.0
      start_point_z: 0.0

    drone_1:
      start_point_x: 3.0
      start_point_y: -2.0
      start_point_z: 0.0

    drone_2:
      start_point_x: 6.0
      start_point_y: -4.0
      start_point_z: 0.0

    drone_3:
      start_point_x: 9.0
      start_point_y: -6.0
      start_point_z: 0.0

    # Mission scenario (used by formation_commander)
    mission:
      commands:
        - formation_type: "line_test"
          formation_scale: 6.0
          distance_threshold: 6.0
          waypoints:
            - [4.5, 20.0, 0.0]

        - formation_type: "square"
          formation_scale: 3.0
          distance_threshold: -1.0
          formation_similarity_threshold: 0.05
          waypoints:
            - [4.5, 27.0, 0.0]

        - formation_type: "square"
          formation_scale: 3.0
          distance_threshold: 6.0
          waypoints:
            - [4.5, 40.0, 0.0]